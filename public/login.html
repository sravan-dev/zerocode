<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Zero Code</title>
<link rel="icon" type="image/svg+xml" href="/zerocode/logo.svg">
<link rel="stylesheet" href="/login.css">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('zc.theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="brand"><img src="/zerocode/logo.svg" alt=""> Zero Code</div>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in to keep chatting with the best AI models.</p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false">Create account</button>
    </div>

    <a class="google hidden" id="google" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
      <span id="google-label">Continue with Google</span>
    </a>
    <div class="or hidden" id="or"><span>or</span></div>

    <form id="form" novalidate>
      <label class="field hidden" id="name-field">Name
        <input name="name" autocomplete="name" maxlength="60" placeholder="Your name">
      </label>
      <label class="field">Email
        <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <label class="field">Password
        <input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
      </label>
      <div class="error hidden" id="error" role="alert"></div>
      <button type="submit" class="submit" id="submit">Sign in</button>
    </form>

    <p class="legal">By continuing you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
  </div>
</main>
<script src="/login.js"></script>
</body>
</html>
